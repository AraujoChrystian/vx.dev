name: Create PR

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  create-pr:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'react ui-gen') ||
      github.event_name == 'issue_comment' && contains(github.event.comment.body, 'gerar')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Run UI Generation via OpenRouter
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: https://openrouter.ai
          OPENAI_MODEL: anthropic/claude-3.5-sonnet
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          run: |
          deno run --allow-net --allow-read --allow-write scripts/main.ts

