name: Create PR

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  create-pr:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'react ui-gen') ||
      github.event_name == 'issue_comment' && contains(github.event.comment.body, 'gerar')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          if [ -f "package.json" ]; then
            npm install
          fi

      - name: Run UI Generation via OpenRouter
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: https://openrouter.ai
          OPENAI_MODEL: anthropic/claude-3.5-sonnet
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -f "main.js" ]; then
            node main.js
          elif [ -f "index.js" ]; then
            node index.js
          else
            node src/main.js || node src/index.js || node scripts/main.js
          fi
